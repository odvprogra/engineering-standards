# Actions are pinned to commit SHAs; Dependabot proposes the bumps (SHA + version comment) weekly.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /tests/fixtures/sample-service
    schedule:
      interval: weekly
    groups:
      sample-service:
        patterns: ["*"]
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directory: /tests/fixtures/sample-node-browser
    schedule:
      interval: weekly
    groups:
      sample-node-browser:
        patterns: ["*"]
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directory: /tests/fixtures/sample-node
    schedule:
      interval: weekly
    groups:
      sample-node:
        patterns: ["*"]
    # The fixture runs on Node.js 24, the version web-ci.yml installs by default.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
