name: Security

# Reusable workflow (HANDBOOK §1, §10):
# - pip-audit: known vulnerabilities in the Python dependencies locked in uv.lock.
# - pnpm audit: known vulnerabilities in the Node dependencies locked in pnpm-lock.yaml. The
#   project's own exceptions (pnpm-workspace.yaml `auditConfig.ignoreGhsas`) are honored.
# - gitleaks: secrets anywhere in the git history. A repo-level .gitleaks.toml is honored.

on:
  workflow_call:
    inputs:
      working-directory:
        description: >-
          Directory that contains pyproject.toml and uv.lock, or package.json and pnpm-lock.yaml.
        type: string
        default: "."
      audit-python:
        description: Audit the Python dependencies locked in uv.lock.
        type: boolean
        default: true
      audit-node:
        description: Audit the Node dependencies locked in pnpm-lock.yaml.
        type: boolean
        default: false

permissions:
  contents: read

env:
  PIP_AUDIT_VERSION: "2.10.1"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  python-dependencies:
    name: Audit Python dependencies
    if: inputs.audit-python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Export the locked dependency set
        run: >-
          uv export --locked --all-extras --all-groups --no-emit-project
          --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"

      # --disable-pip audits the hashed, fully pinned export without installing anything.
      - name: Audit for known vulnerabilities
        run: >-
          uvx "pip-audit@$PIP_AUDIT_VERSION"
          --requirement "$RUNNER_TEMP/requirements.txt"
          --disable-pip --require-hashes --strict --progress-spinner off

  node-dependencies:
    name: Audit Node dependencies
    if: inputs.audit-node
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm at the version package.json pins (`packageManager`); it audits the lockfile without
      # installing anything.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - name: Audit for known vulnerabilities
        run: pnpm audit

  secrets:
    name: Scan git history for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, not only the last commit
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" gitleaks

      - name: Scan
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'
