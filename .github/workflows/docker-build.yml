name: Docker build

# Reusable workflow (HANDBOOK §4, §8, §10): build the image, check that it runs as a non-root user,
# start it and smoke-test its readiness endpoint.
#
# Services whose readiness depends on infrastructure (e.g. PostgreSQL) pass `compose-file`: the stack
# is started with `docker compose up --build --wait`, so the app service needs a healthcheck.

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context.
        type: string
        default: "."
      dockerfile:
        description: Path to the Dockerfile, relative to the repository root.
        type: string
        default: Dockerfile
      compose-file:
        description: Optional compose file used for the smoke test instead of a single container.
        type: string
        default: ""
      container-port:
        description: Port the app listens on inside the container (single-container mode).
        type: number
        default: 8000
      readiness-url:
        description: URL polled until it answers 2xx.
        type: string
        default: http://localhost:8000/health/ready

permissions:
  contents: read

env:
  IMAGE: ci-image:${{ github.sha }}

jobs:
  docker-build:
    name: Build and smoke-test image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          tags: ${{ env.IMAGE }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image runs as a non-root user
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE")"
          echo "Configured user: '${user}'"
          case "${user%%:*}" in
            "" | root | 0) echo "::error::The image must set a non-root USER"; exit 1 ;;
          esac

      - name: Start container
        if: inputs.compose-file == ''
        env:
          CONTAINER_PORT: ${{ inputs.container-port }}
        run: docker run --detach --name app --publish "${CONTAINER_PORT}:${CONTAINER_PORT}" "$IMAGE"

      - name: Start stack
        if: inputs.compose-file != ''
        env:
          COMPOSE_FILE: ${{ inputs.compose-file }}
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Smoke test readiness
        env:
          READINESS_URL: ${{ inputs.readiness-url }}
        run: >-
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors
          "$READINESS_URL"

      - name: Logs on failure
        if: failure()
        env:
          COMPOSE_FILE: ${{ inputs.compose-file }}
        run: |
          if [ -n "$COMPOSE_FILE" ]; then docker compose logs; else docker logs app || true; fi

      - name: Tear down
        if: always()
        env:
          COMPOSE_FILE: ${{ inputs.compose-file }}
        run: |
          if [ -n "$COMPOSE_FILE" ]; then docker compose down --volumes; else docker rm --force app || true; fi
