name: Self-test

# Runs every reusable workflow against minimal sample projects, so a change that breaks one fails
# here before it reaches the repositories that call it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-ci:
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: tests/fixtures/sample-service

  security:
    uses: ./.github/workflows/security.yml
    with:
      working-directory: tests/fixtures/sample-service
